<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Démo — Aperçu d'œuvre en modale (depuis la synchro)</title>
<style>
  :root {
    --soft-ivory:#FCFAF4; --porcelain:#FFFFFF; --warm-gold:#C99A3D;
    --ink:#111827; --slate:#5D6875; --stone:#A79E91; --mist:#D8D2C8; --cloud:#EFE8DE;
    --succes:#4F8A5B;
    --font-titre:'Cormorant Garamond',Georgia,serif;
    --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--soft-ivory); font-family:var(--font-ui); color:var(--ink); }
  /* Faux écran de synchro derrière, pour montrer qu'il reste en place */
  .fond { padding:28px; filter:blur(1px); opacity:.5; }
  .fond h1 { font-family:var(--font-titre); font-weight:600; font-size:26px; margin:0 0 14px; }
  .fond .carte { background:#fff; border:1px solid var(--mist); border-radius:14px; padding:16px; max-width:820px; margin-bottom:12px; height:90px; }

  .overlay-modale { position:fixed; inset:0; background:rgba(7,26,47,.45); display:flex; align-items:center; justify-content:center; z-index:1000; backdrop-filter:blur(2px); }
  .apercu-oeuvre { position:relative; background:var(--porcelain); border-radius:16px; box-shadow:0 18px 50px rgba(7,26,47,.28); width:min(760px,92vw); max-height:88vh; display:flex; flex-direction:column; overflow:hidden; }
  .apercu-fermer { position:absolute; top:10px; right:12px; z-index:2; width:32px; height:32px; border:none; background:rgba(255,255,255,.85); border-radius:999px; font-size:22px; line-height:1; color:var(--slate); cursor:pointer; }
  .apercu-corps { display:grid; grid-template-columns:260px 1fr; gap:20px; padding:22px; overflow:auto; }
  .apercu-image { background:var(--cloud); border-radius:12px; aspect-ratio:1/1; display:grid; place-items:center; overflow:hidden; }
  .apercu-image-vide { font-size:52px; color:var(--stone); }
  .apercu-sku { font-size:12px; font-weight:700; color:var(--warm-gold); letter-spacing:.03em; margin-bottom:4px; }
  .apercu-titre { font-family:var(--font-titre); font-size:26px; font-weight:600; color:var(--ink); margin:0 0 2px; line-height:1.15; }
  .apercu-artiste { font-size:14px; color:var(--slate); margin:0 0 12px; }
  .apercu-badges { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .badge-statut { font-size:12px; padding:2px 9px; border-radius:999px; font-weight:600; background:#e7f2ea; color:#1f7a45; }
  .apercu-prix { font-size:17px; font-weight:600; color:var(--ink); }
  .apercu-meta { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:0 0 14px; font-size:13.5px; }
  .apercu-meta dt { color:var(--slate); font-weight:500; }
  .apercu-meta dd { color:var(--ink); margin:0; }
  .apercu-desc { font-size:13.5px; color:var(--ink); line-height:1.55; white-space:pre-wrap; border-top:1px solid var(--mist); padding-top:12px; }
  .apercu-actions { display:flex; justify-content:flex-end; gap:8px; padding:14px 22px; border-top:1px solid var(--mist); background:var(--soft-ivory); }
  .btn-action { padding:9px 15px; border-radius:10px; font-size:14px; font-weight:500; cursor:pointer; border:1px solid var(--mist); background:#fff; color:var(--ink); }
  .btn-principal { background:var(--warm-gold); color:#fff; border-color:var(--warm-gold); }
</style>
</head>
<body>
  <div class="fond">
    <h1>Synchronisation avec le site</h1>
    <div class="carte"></div>
    <div class="carte"></div>
    <div class="carte"></div>
  </div>

  <div class="overlay-modale">
    <div class="apercu-oeuvre" role="dialog" aria-modal="true">
      <button class="apercu-fermer" aria-label="Fermer">&times;</button>
      <div class="apercu-corps">
        <div class="apercu-image"><span class="apercu-image-vide">&#9635;</span></div>
        <div class="apercu-infos">
          <div class="apercu-sku">Nº MTG-0142</div>
          <h2 class="apercu-titre">Matin sur le fleuve</h2>
          <p class="apercu-artiste">Marie Tremblay-Gagnon</p>
          <div class="apercu-badges"><span class="badge-statut">Disponible</span><span class="apercu-prix">1 850 $</span></div>
          <dl class="apercu-meta">
            <dt>Année</dt><dd>2023</dd>
            <dt>Dimensions</dt><dd>24 × 36 po</dd>
            <dt>Médium</dt><dd>Huile</dd>
            <dt>Support</dt><dd>Toile</dd>
            <dt>Format</dt><dd>Grand</dd>
          </dl>
          <div class="apercu-desc">Huile sur toile évoquant le lever du jour sur le Richelieu, dans une palette de bleus et d'ocres.</div>
        </div>
      </div>
      <div class="apercu-actions">
        <button class="btn-action">Ouvrir la fiche complète</button>
        <button class="btn-action btn-principal">Fermer</button>
      </div>
    </div>
  </div>
</body>
</html>
