<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<title>Cartels · La Galerie du Vieux Saint-Jean</title>
<style>
:root{ --accent:#900001; --encre:#1c1a17; --gris:#6b6459; --filet:#c8bfa8; }
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:#e8e3db;color:var(--encre);}

/* ---------------------------------------------------------------------------
   L'ORIENTATION SUIT LE NOMBRE DE CARTELS PAR PAGE.

   Un cartel est un objet large et bas : une ligne de texte flanquée d'une
   vignette et d'un code QR. Dans une feuille portrait, moins il y a de
   cartels, plus chaque case s'étire en hauteur, et le vide s'accumule
   au-dessus et au-dessous du texte (Dave, 2026-09-07 : « en dehors de 10 par
   page, formatter en paysage plutôt que portrait, comme ça on ne perd pas
   d'espace en haut et en bas »).

   Même grille à deux colonnes dans les deux cas ; seule la feuille tourne :
     10 par page → portrait, case de 96 × 51 mm
      8 par page → paysage,  case de 128 × 48 mm
      6 par page → paysage,  case de 128 × 64 mm
      4 par page → paysage,  case de 128 × 96 mm

   Toujours du Lettre 8,5 × 11 (règle du projet). La règle @page correspondante
   est posée par remplir(), qui seul connaît le format retenu ; le drapeau
   `paysage` passé à printToPDF doit s'accorder avec elle — voir
   genererCartelsPdf dans src/pdf.js.
   (Comparaison des deux orientations : demos/cartels-paysage.html)
--------------------------------------------------------------------------- */
.page{background:#fff;padding:12mm;margin:0 auto;}
.page.port{width:8.5in;height:11in;}
.page.pays{width:11in;height:8.5in;}
@media screen{ .page{box-shadow:0 4px 24px rgba(0,0,0,.14);margin:18px auto;} body{padding:12px;} }
@media print{
  body{background:#fff;padding:0;}
  .page{box-shadow:none;margin:0;}
}

/* Les cases sont égales pour que les traits de découpe soient droits et
   réguliers ; le contenu est CENTRÉ dedans, sinon tout l'espace inutilisé
   s'accumule d'un seul côté. */
.grille{display:grid;gap:0;height:100%;}
.p4  .grille{grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,1fr);}
.p6  .grille{grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);}
.p8  .grille{grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);}
.p10 .grille{grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);}

.cartel{display:flex;align-items:center;justify-content:space-between;gap:4mm;
        padding:4mm 5mm;border:1px dashed var(--filet);
        page-break-inside:avoid;overflow:hidden;}
.cartel-vide{border:0;}
/* Le CORPS réunit la vignette et le texte. Le cartel étant centré, ce bloc
   garde une hauteur libre : c'est lui qui donne à la vignette la hauteur
   exacte du texte. */
.cartel-corps{display:flex;align-items:stretch;gap:4mm;flex:1;min-width:0;}
.cartel-texte{min-width:0;flex:1;}
.cartel-artiste{font-family:Georgia,'Times New Roman',serif;font-size:10.5pt;font-weight:600;
                color:var(--accent);letter-spacing:.02em;margin-bottom:1mm;}
.cartel-titre{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:13pt;
              line-height:1.2;margin-bottom:1.5mm;}
.cartel-tech{font-size:9pt;color:var(--gris);line-height:1.35;margin-bottom:2mm;}
.cartel-pied{display:flex;align-items:baseline;gap:4mm;font-size:8.5pt;}
.cartel-inv{color:var(--gris);letter-spacing:.04em;}
.cartel-prix{font-family:Georgia,'Times New Roman',serif;font-size:11.5pt;font-weight:600;margin-left:auto;}
.cartel-qr{flex:0 0 auto;width:26mm;height:26mm;}
.cartel-qr svg{width:100%;height:100%;display:block;}
/* Pas d'adresse sur le site : on laisse la place vide plutôt que d'imprimer
   un code qui ne mènerait nulle part. */
.cartel-qr-vide{width:100%;height:100%;}

.p4 .cartel-titre{font-size:15pt;} .p4 .cartel-qr{width:32mm;height:32mm;}
.p8 .cartel{padding:3.5mm 4.5mm;} .p8 .cartel-titre{font-size:12pt;} .p8 .cartel-qr{width:24mm;height:24mm;}
.p10 .cartel{padding:3mm 4mm;gap:3mm;}
.p10 .cartel-corps{gap:3mm;}
.p10 .cartel-artiste{font-size:9.5pt;margin-bottom:.6mm;}
.p10 .cartel-titre{font-size:11pt;margin-bottom:1mm;}
.p10 .cartel-tech{font-size:8pt;margin-bottom:1.4mm;}
.p10 .cartel-pied{font-size:8pt;}
.p10 .cartel-prix{font-size:10.5pt;}
.p10 .cartel-qr{width:22mm;height:22mm;}

/* ---------------------------------------------------------------------------
   Avec photo : une VIGNETTE DE REPÉRAGE à gauche, pas une illustration.

   « Ces images ne servent qu'à associer plus rapidement quel cartel va avec
   quelle toile. Ça ne sert pas vraiment à montrer les toiles. » (Dave,
   2026-09-06). La photo est donc un repère, et le TEXTE reste le sujet du
   cartel.

   Sa LARGEUR est fixe et dépend du format ; sa HAUTEUR est celle du bloc de
   texte (Dave, 2026-09-07 : « il faudrait que l'image de la toile suive la
   taille du texte »). Elle grandit donc avec le texte, et se retrouve d'aplomb
   en face de lui — un carré de taille fixe paraissait minuscule sur un grand
   cartel et décalé vers le haut sur un petit.

   ⚠ L'image est en POSITION ABSOLUE dans sa case : elle ne compte pour rien
   dans le calcul des hauteurs. C'est ce qui rend impossible le retour du
   défaut du 2026-09-06, où une photo en hauteur poussait la case et étalait
   une page de six cartels sur quatre feuilles. Aucune dimension d'image ne
   peut influencer la hauteur d'un cartel.
   (Comparaisons : demos/cartels-vignette.html, demos/cartels-paysage.html)
--------------------------------------------------------------------------- */
.cartel-photo{flex:0 0 auto;position:relative;align-self:stretch;width:20mm;overflow:hidden;}
.cartel-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}
/* Œuvre sans photo : une case vide de MÊME largeur, pour que les cartels d'une
   page restent alignés entre eux. */
.cartel-photo-vide{flex:0 0 auto;width:20mm;}
.p4 .cartel-photo,.p4 .cartel-photo-vide{width:24mm;}
.p8 .cartel-photo,.p8 .cartel-photo-vide{width:18mm;}
.p10 .cartel-photo,.p10 .cartel-photo-vide{width:15mm;}
</style>
<style id="orientation">@media print{@page{size:letter portrait;margin:0;}}</style></head>
<body>
<div id="doc"></div>
<script>
function escHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}

// Le format retenu commande à la fois la grille et l'orientation de la
// feuille. Un format hors liste retombe sur 10 plutôt que de casser la grille.
var FORMATS_PERMIS = [4, 6, 8, 10];
function formatCartels(n){ return FORMATS_PERMIS.indexOf(n) >= 0 ? n : 10; }
function orientationCartels(n){ return formatCartels(n) === 10 ? 'port' : 'pays'; }

// data = { format, afficherPrix, avecPhoto, afficherQr, cartels: [
//   { artiste, titre, technique, dimensions, inventaire, prix, qr, photo } ] }
// `qr` est déjà un <svg> et `photo` une image en data URL, produits côté
// application (src/qr.js, photoEnDataUrl) : le gabarit ne calcule rien, il met
// en page — comme les autres gabarits du projet.
function remplir(data){
  data = data || {};
  var avecPhoto = !!data.avecPhoto;
  var parPage = formatCartels(data.format);
  var sens = orientationCartels(parPage);
  var avecPrix = !!data.afficherPrix;
  var avecQr = data.afficherQr !== false; // absent = oui (anciens appels)
  var cartels = data.cartels || [];

  // La règle @page ne peut pas être conditionnée par une classe : on la pose
  // ici, une fois le format connu. Elle doit s'accorder avec le drapeau
  // `paysage` envoyé à printToPDF, sinon la feuille et le contenu tournent
  // l'un sans l'autre.
  var styleSens = document.getElementById('orientation');
  if (styleSens) {
    styleSens.textContent = '@media print{@page{size:letter '
      + (sens === 'pays' ? 'landscape' : 'portrait') + ';margin:0;}}';
  }

  var html = '';
  for (var d = 0; d < cartels.length; d += parPage) {
    var lot = cartels.slice(d, d + parPage);
    var cases = '';
    for (var i = 0; i < lot.length; i++) {
      var c = lot[i];
      var tech = [c.technique, c.dimensions].filter(Boolean).join(' · ');
      var bloc = '<div class="cartel-texte">'
          + '<p class="cartel-artiste">' + escHtml(c.artiste) + '</p>'
          + '<p class="cartel-titre">' + escHtml(c.titre) + '</p>'
          + (tech ? '<p class="cartel-tech">' + escHtml(tech) + '</p>' : '')
          + '<p class="cartel-pied">'
            + '<span class="cartel-inv">' + escHtml(c.inventaire || '') + '</span>'
            + (avecPrix && c.prix ? '<span class="cartel-prix">' + escHtml(c.prix) + '</span>' : '')
          + '</p>'
        + '</div>';
      var qr = avecQr
        ? '<div class="cartel-qr">' + (c.qr || '<div class="cartel-qr-vide"></div>') + '</div>'
        : '';

      if (avecPhoto) {
        var img = c.photo
          ? '<div class="cartel-photo"><img src="' + c.photo + '" alt=""></div>'
          : '<div class="cartel-photo-vide"></div>';
        // Vignette et texte forment le CORPS du cartel ; le code QR reste à
        // part, à droite. C'est ce qui permet à la vignette de se caler sur la
        // hauteur du texte sans se caler sur celle du code QR.
        cases += '<div class="cartel"><div class="cartel-corps">' + img + bloc + '</div>' + qr + '</div>';
      } else {
        cases += '<div class="cartel">' + bloc + qr + '</div>';
      }
    }
    // Cases vides pour que la dernière page garde la même grille de découpe.
    for (var v = lot.length; v < parPage; v++) cases += '<div class="cartel cartel-vide"></div>';
    html += '<div class="page ' + sens + ' p' + parPage + (avecPhoto ? ' avec-photo' : '')
          + '"><div class="grille">' + cases + '</div></div>';
  }
  document.getElementById('doc').innerHTML = html || '<div class="page port"></div>';
}
</script>
</body></html>
